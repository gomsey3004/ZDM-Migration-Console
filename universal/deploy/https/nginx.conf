user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;
include /usr/share/nginx/modules/*.conf;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    server {
        listen 80 default_server;
        server_name 144.24.37.222;
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/zdm-acme;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://144.24.37.222$request_uri; }
    }
    server {
        listen 443 ssl default_server;
        server_name 144.24.37.222;
        ssl_certificate /etc/letsencrypt/live/zdm-ip/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zdm-ip/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ZDM_SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        client_max_body_size 400k;
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host 144.24.37.222;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }
    }
}
